<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biology Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>

html, body{
  height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:'Comic Neue', Arial;
}

body{
  background: radial-gradient(circle at top,#0b1b2b,#07111c,#050b12);
  color:white;
  text-align:center;
  position:relative;
}

/* STAR */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation:floatStar linear infinite;
}

@keyframes floatStar{
  from{ transform:translateY(110vh); }
  to{ transform:translateY(-20vh); }
}

/* PARTICLE */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(0,200,255,0.35);
  border-radius:50%;
  animation:move linear infinite;
}

@keyframes move{
  0%{ transform:translate(0,100vh); }
  100%{ transform:translate(100vw,-10vh); }
}

/* CUTE */
.cute{
  position:absolute;
  animation:floatCute linear infinite;
  pointer-events:none;
}

@keyframes floatCute{
  from{ transform:translateY(110vh) rotate(0deg); }
  to{ transform:translateY(-20vh) rotate(360deg); }
}

/* MENU */
#menu{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:5;
}

#menu h1{
  font-size:42px;
  margin-bottom:10px;
  text-shadow:0 0 20px cyan;
}

/* GAME BOX */
.box{
  display:none;
  width:92%;
  max-width:520px;
  margin:40px auto;
  padding:20px;
  background:rgba(27,42,65,0.85);
  backdrop-filter:blur(6px);
  border-radius:24px;
  box-shadow:0 0 25px rgba(0,255,255,0.15);
}

/* BUTTON */
button{
  width:90%;
  padding:14px;
  margin:8px;
  font-size:16px;
  font-family:'Comic Neue', Arial;
  border:none;
  border-radius:16px;
  cursor:pointer;
  background: linear-gradient(135deg,#00aaff,#66ffcc);
  color:white;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* HINT BUTTON */
#hintBtn{
  background: linear-gradient(135deg,#ffcc00,#ff66aa);
  color:black;
}

/* NEXT */
#nextBtn{
  display:none;
  background:#00ffb3;
  color:black;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- effects -->
<div class="star"></div><div class="star"></div><div class="star"></div>
<div class="particle"></div><div class="particle"></div>

<div class="cute">🧬</div><div class="cute">🧪</div><div class="cute">✨</div>

<!-- MENU -->
<div id="menu">
  <h1>🧪 Biology Quiz</h1>
  <button onclick="startGame()">▶ Start</button>
</div>

<!-- GAME -->
<div class="box" id="game">

<h2 id="question"></h2>
<img id="questionImage" style="display:none; width:100%; max-width:300px; border-radius:18px;">

<div id="timer">⏰ Time: 30</div>

<div id="answers"></div>

<p id="score">Score: 0</p>
<p id="explain"></p>

<button id="hintBtn" onclick="useHint()">💡 Hint (50/50)</button>
<button id="nextBtn" onclick="nextQuestion()">Next ➜</button>

</div>

<script>

const sfxCorrect = new Audio("correct.wav");
const sfxWrong = new Audio("wrong.wav");
const sfxClick = new Audio("click.wav");
const sfxFinish = new Audio("finish.wav");

const quiz = [
{
question:"การแพร่ คืออะไร?",
image:"",
answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],
correct:0,
explain:"การแพร่ คือการเคลื่อนที่ของสารจากเข้มข้นสูงไปต่ำ โดยไม่ใช้พลังงาน"
},
{
question:"ข้อใดเป็นตัวอย่างของการแพร่?",
image:"",
answers:[
"น้ำเข้าสู่รากพืช",
"ออกซิเจนเข้าสู่เซลล์",
"เม็ดเลือดขาวกินเชื้อโรค",
"การย่อยอาหาร"
],
correct:1,
explain:"ออกซิเจนเข้าสู่เซลล์เป็นการแพร่"
},
{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",
image:"",
answers:[
"โปรตีน",
"น้ำ",
"DNA",
"ออกซิเจน"
],
correct:1,
explain:"Osmosis คือการเคลื่อนที่ของน้ำผ่านเยื่อเลือกผ่าน"
}
];

quiz.sort(()=>Math.random()-0.5);

let i=0;
let score=0;
let time=30;
let timer;
let locked=false;
let hintUsed=false;

function startGame(){
  sfxClick.play();
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  load();
}

function startTimer(){
  time=30;
  document.getElementById("timer").innerText="⏰ Time: "+time;

  timer=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="⏰ Time: "+time;
    if(time<=0){
      clearInterval(timer);
      fail();
    }
  },1000);
}

function load(){

  locked=false;
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("explain").innerText="";

  hintUsed=false;
  document.getElementById("hintBtn").disabled=false;
  document.getElementById("hintBtn").innerText="💡 Hint (50/50)";

  clearInterval(timer);

  let q=quiz[i];
  document.getElementById("question").innerText=q.question;

  document.getElementById("answers").innerHTML="";

  startTimer();

  let shuffled=q.answers.map((a,index)=>({
    text:a,
    correct:index===q.correct
  }));

  shuffled.sort(()=>Math.random()-0.5);

  shuffled.forEach(choice=>{
    let b=document.createElement("button");
    b.innerText=choice.text;
    b.onclick=()=>check(choice.correct,q);
    document.getElementById("answers").appendChild(b);
  });
}

function check(isCorrect,q){

  if(locked) return;
  locked=true;
  clearInterval(timer);

  const correctText=q.answers[q.correct];

  if(isCorrect){
    sfxCorrect.play();
    score++;
    document.getElementById("score").innerText="Score: "+score;
    document.getElementById("explain").innerText="✔ ถูกต้อง\n\n"+q.explain;
  }else{
    sfxWrong.play();
    document.getElementById("explain").innerText="❌ ผิด\n✔ คำตอบ:"+correctText+"\n\n"+q.explain;
  }

  document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);

  document.getElementById("nextBtn").style.display="block";
}

function fail(){
  sfxWrong.play();
  locked=true;

  let q=quiz[i];
  document.getElementById("explain").innerText=
  "⏰ หมดเวลา\n✔ "+q.answers[q.correct]+"\n\n"+q.explain;

  document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);

  document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){
  sfxClick.play();
  i++;

  if(i<quiz.length){
    load();
  }else{
    sfxFinish.play();
    document.getElementById("game").innerHTML=
    `<h1>🎉 Finished!</h1><h2>Score: ${score}/${quiz.length}</h2>`;
  }
}

function useHint(){

  if(hintUsed) return;
  hintUsed=true;

  const buttons=[...document.querySelectorAll("#answers button")];
  const q=quiz[i];

  const correctText=q.answers[q.correct];

  let wrong=buttons.filter(b=>b.innerText!==correctText);

  wrong.sort(()=>Math.random()-0.5);

  let remove=Math.floor(wrong.length/2);

  for(let j=0;j<remove;j++){
    wrong[j].style.display="none";
  }

  document.getElementById("hintBtn").disabled=true;
  document.getElementById("hintBtn").innerText="💡 Used";
}

/* effects */
document.querySelectorAll(".cute").forEach(el=>{
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(6+Math.random()*6)+"s";
});

</script>

</body>
</html>
