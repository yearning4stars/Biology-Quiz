<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Quiz Pro</title>

<style>

body{
  background: radial-gradient(circle at top,#0b1b2b,#07111c,#050b12);
  min-height:100vh;
  overflow:hidden;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

.box{
  background:rgba(27,42,65,0.85);
  backdrop-filter:blur(6px);
  width:90%;
  max-width:500px;
  margin:auto;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px black;
}

button{
  width:90%;
  padding:15px;
  margin:10px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#00aaff;
  color:white;
}

button:hover{
  transform:scale(1.03);
}

#bar{
  width:100%;
  height:10px;
  background:#233;
  border-radius:10px;
  margin:10px 0;
}

#fill{
  height:10px;
  width:100%;
  background:#00ffb3;
  border-radius:10px;
  transition:width 1s linear;
}

#timer{
  font-size:18px;
  margin:10px;
}

#combo{
  font-size:16px;
  color:#ffd700;
}

</style>
</head>

<body>

<div class="box">

<h1>🧪 Biology Quiz Pro</h1>

<div id="bar"><div id="fill"></div></div>
<div id="timer">Time: 10</div>
<div id="combo">Combo: 0</div>

<h2 id="question"></h2>
<div id="answers"></div>

<p id="score">Score: 0</p>

</div>

<script>

const allQuiz = [
{q:"Diffusion คืออะไร?",a:["เข้ม→จาง","ใช้ ATP","แบ่งเซลล์","สร้างโปรตีน"],c:0},
{q:"Osmosis คืออะไร?",a:["โปรตีน","น้ำ","DNA","ออกซิเจน"],c:1},
{q:"น้ำเคลื่อนที่แบบออสโมซิสไปทางใด?",a:["เข้ม→จางน้ำ","น้ำมาก→น้ำน้อย","น้ำน้อย→น้ำมาก","สุ่ม"],c:1},
{q:"Diffusion ใช้พลังงานไหม?",a:["ใช้ ATP","ไม่ใช้","ใช้กลูโคส","ใช้เอนไซม์"],c:1},
{q:"สมดุลการแพร่เรียกว่าอะไร?",a:["osmosis","diffusion","equilibrium","reaction"],c:2},
{q:"เยื่อเลือกผ่านคืออะไร?",a:["membrane","wall","DNA","protein"],c:0},
{q:"ATP คืออะไร?",a:["พลังงาน","น้ำ","โปรตีน","ไขมัน"],c:0},
{q:"เซลล์ใช้พลังงานหลัก?",a:["ATP","DNA","RNA","O2"],c:0},
{q:"photosynthesis ใช้พลังงานอะไร?",a:["แสง","น้ำ","CO2","ATP"],c:0},
{q:"หายใจเซลล์ได้อะไร?",a:["ATP","O2","น้ำ","glucose"],c:0}
];

// shuffle
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()* (i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

shuffle(allQuiz);

// 10 random questions
const quiz = allQuiz.slice(0,10);

let i=0;
let score=0;
let combo=0;
let time=10;
let timer;

function startTimer(){
  time=10;
  document.getElementById("fill").style.width="100%";

  timer=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="Time: "+time;
    document.getElementById("fill").style.width=(time/10*100)+"%";

    if(time<=0){
      clearInterval(timer);
      failQuestion();
    }
  },1000);
}

function failQuestion(){
  combo=0;
  next();
}

function load(){
  clearInterval(timer);

  let q=quiz[i];
  document.getElementById("question").innerText=q.q;
  document.getElementById("answers").innerHTML="";

  startTimer();

  let mapped=q.a.map((t,idx)=>({t,correct:idx===q.c}))
  .sort(()=>Math.random()-0.5);

  mapped.forEach(x=>{
    let b=document.createElement("button");
    b.innerText=x.t;
    b.onclick=()=>{
      clearInterval(timer);

      if(x.correct){
        score++;
        combo++;
      }else{
        combo=0;
      }

      document.getElementById("score").innerText="Score: "+score;
      document.getElementById("combo").innerText="Combo: "+combo;

      setTimeout(next,500);
    };
    document.getElementById("answers").appendChild(b);
  });
}

function next(){
  i++;
  if(i<quiz.length){
    load();
  }else{
    showRank();
  }
}

function showRank(){

let rank="F";

if(score>=9) rank="S";
else if(score>=7) rank="A";
else if(score>=5) rank="B";
else if(score>=3) rank="C";

document.querySelector(".box").innerHTML=`
<h1>Finished</h1>
<h2>Score: ${score}/10</h2>
<h2>Rank: ${rank}</h2>
<h3>Combo max: ${combo}</h3>
`;
}

load();

</script>

</body>
</html>
