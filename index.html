<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology Quiz</title>

<style>

body{
  background: radial-gradient(circle at top,#0b1b2b,#07111c,#050b12);
  min-height:100vh;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
  overflow:hidden;
}

/* ⭐ ดาว */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation:floatStar 8s linear infinite;
}

@keyframes floatStar{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

/* 🧪 อนุภาคเคมี */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(0,200,255,0.4);
  border-radius:50%;
  animation:move 12s linear infinite;
}

@keyframes move{
  0%{ transform:translate(0,100vh); }
  100%{ transform:translate(100vw,-10vh); }
}

.box{
  background:rgba(27,42,65,0.85);
  backdrop-filter:blur(6px);
  width:90%;
  max-width:500px;
  margin:auto;
  padding:20px;
  border-radius:20px;
}

button{
  width:90%;
  padding:15px;
  margin:10px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#00aaff;
  color:white;
}

#timer{
  font-size:18px;
  margin:10px;
  color:#00ffb3;
}

#explain{
  margin-top:10px;
  color:#bcdcff;
  white-space:pre-line;
}

#nextBtn{
  display:none;
  width:90%;
  padding:12px;
  margin-top:10px;
  background:#00ffb3;
  color:black;
  font-weight:bold;
  border-radius:10px;
}

</style>
</head>

<body>

<!-- ⭐ ดาว -->
<div class="star" style="left:10%; animation-duration:7s;"></div>
<div class="star" style="left:25%; animation-duration:9s;"></div>
<div class="star" style="left:40%; animation-duration:6s;"></div>
<div class="star" style="left:60%; animation-duration:10s;"></div>
<div class="star" style="left:80%; animation-duration:8s;"></div>

<!-- 🧪 อนุภาค -->
<div class="particle" style="left:20%;"></div>
<div class="particle" style="left:50%; animation-duration:15s;"></div>
<div class="particle" style="left:70%; animation-duration:11s;"></div>

<div class="box">

<h1>🧪 Biology Quiz</h1>

<div id="timer">Time: 30</div>

<h2 id="question">Loading...</h2>
<div id="answers"></div>

<p id="score">Score: 0</p>
<p id="explain"></p>

<button id="nextBtn" onclick="nextQuestion()">Next Question ➜</button>

</div>

<script>

const quiz = [
{
question:"การแพร่ (Diffusion) คืออะไร?",
answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],
correct:0,
explain:"Diffusion เป็นการเคลื่อนที่ของสารจากเข้มข้นสูงไปต่ำ โดยไม่ใช้พลังงาน"
},
{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",
answers:["โปรตีน","น้ำ","DNA","ออกซิเจน"],
correct:1,
explain:"Osmosis คือการเคลื่อนที่ของน้ำผ่านเยื่อเลือกผ่าน"
},
{
question:"น้ำจะเคลื่อนที่ไปทางใดในการออสโมซิส?",
answers:[
"จากสารเข้มข้นมากไปน้อย",
"จากน้ำมากไปน้ำน้อย",
"จากน้ำน้อยไปน้ำมาก",
"สุ่มทิศทาง"
],
correct:1,
explain:"น้ำจะเคลื่อนจากบริเวณที่มีน้ำมากไปน้ำน้อย"
},
{
question:"ภาวะที่อนุภาคเท่ากันทุกบริเวณเรียกว่าอะไร?",
answers:[
"การออสโมซิส",
"การแพร่แบบธรรมดา",
"ไก่หมกหม้อ",
"สมดุลการแพร่"
],
correct:3,
explain:"เรียกว่า dynamic equilibrium หรือสมดุลการแพร่"
},
{
question:"การแพร่ใช้พลังงานแบบไหน?",
answers:["ใช้ ATP","ไม่ใช้พลังงาน","ใช้กลูโคส","ใช้เอนไซม์"],
correct:1,
explain:"Diffusion เป็น passive transport ไม่ใช้พลังงาน"
}
];

let i=0;
let score=0;
let time=30;
let timer;
let locked=false;

function startTimer(){
  time=30;
  document.getElementById("timer").innerText="Time: "+time;

  timer=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="Time: "+time;

    if(time<=0){
      clearInterval(timer);
      fail();
    }
  },1000);
}

function load(){
  locked=false;
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("explain").innerText="";

  let q=quiz[i];
  document.getElementById("question").innerText=q.question;
  document.getElementById("answers").innerHTML="";

  startTimer();

  q.answers.forEach((a,idx)=>{
    let b=document.createElement("button");
    b.innerText=a;
    b.onclick=()=>check(idx);
    document.getElementById("answers").appendChild(b);
  });
}

function check(idx){

  if(locked) return;
  locked=true;

  clearInterval(timer);

  let q=quiz[i];
  let correctText=q.answers[q.correct];

  if(idx===q.correct){
    score++;
    document.getElementById("score").innerText="✅ Correct!";
    document.getElementById("explain").innerText="✔ ถูกต้อง!\n"+q.explain;
  }else{
    document.getElementById("score").innerText="❌ Wrong!";
    document.getElementById("explain").innerText=
      "❌ ผิดเพราะคำตอบนี้ไม่ถูกหลักชีวะ\n" +
      "✔ คำตอบที่ถูกคือ: " + correctText + "\n\n" +
      q.explain;
  }

  document.getElementById("nextBtn").style.display="block";
}

function fail(){
  locked=true;
  let q=quiz[i];

  document.getElementById("score").innerText="⏰ Time Out!";
  document.getElementById("explain").innerText=
    "❌ หมดเวลา\n✔ คำตอบที่ถูกคือ: " + q.answers[q.correct] + "\n\n" +
    q.explain;

  document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){
  i++;
  if(i<quiz.length){
    load();
  }else{
    document.querySelector(".box").innerHTML=
    `<h1>Finished 🧪</h1>
     <h2>Score: ${score}/${quiz.length}</h2>`;
  }
}

load();

</script>

</body>
</html>
