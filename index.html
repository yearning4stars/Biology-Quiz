<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biology Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>

html, body{
  height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  font-family:'Comic Neue', Arial;
}

/* 🌌 BACKGROUND */
body{
  background: radial-gradient(circle at top,#0b1b2b,#07111c,#050b12);
  color:white;
  text-align:center;
}

/* 🌟 STAR */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation:floatStar linear infinite;
}

@keyframes floatStar{
  from{transform:translateY(110vh);}
  to{transform:translateY(-20vh);}
}

/* 🧪 PARTICLE */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(0,200,255,0.35);
  border-radius:50%;
  animation:move linear infinite;
}

@keyframes move{
  0%{transform:translate(0,100vh);}
  100%{transform:translate(100vw,-10vh);}
}

/* 🌸 CUTE */
.cute{
  position:absolute;
  animation:floatCute linear infinite;
}

@keyframes floatCute{
  from{transform:translateY(110vh);}
  to{transform:translateY(-20vh);}
}

/* MENU */
#menu{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* GAME */
.box{
  display:none;
  width:92%;
  max-width:520px;
  margin:40px auto;
  padding:20px;
  background:rgba(27,42,65,0.85);
  border-radius:20px;
}

/* BUTTON */
button{
  width:90%;
  padding:14px;
  margin:8px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#00aaff,#66ffcc);
  color:white;
}

/* LEADERBOARD */
#leaderboard{
  display:none;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="star"></div><div class="star"></div><div class="star"></div>
<div class="particle"></div><div class="particle"></div>
<div class="cute">🧬</div><div class="cute">🧪</div>

<!-- MENU -->
<div id="menu">
  <h1>🧪 Biology Quiz</h1>
  <input id="playerName" placeholder="Enter name">
  <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div class="box" id="game">

<h2 id="question"></h2>
<div id="answers"></div>
<p id="score">Score: 0</p>
<p id="explain"></p>
<button id="nextBtn" onclick="nextQuestion()">Next</button>

</div>

<script>

let quiz = [
{
question:"การแพร่ คืออะไร?",
answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],
correct:0,
explain:"การแพร่คือการเคลื่อนที่ของสารจากเข้มข้นสูงไปต่ำ"
},
{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",
answers:[
"โปรตีน",
"น้ำ",
"DNA",
"ออกซิเจน"
],
correct:1,
explain:"Osmosis คือการเคลื่อนที่ของน้ำ"
}
];

quiz.sort(()=>Math.random()-0.5);

let i=0;
let score=0;
let locked=false;

function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
load();
}

function load(){
locked=false;
document.getElementById("explain").innerText="";
document.getElementById("nextBtn").style.display="none";

let q = quiz[i];
document.getElementById("question").innerText = q.question;

document.getElementById("answers").innerHTML="";

q.answers.forEach((a,idx)=>{
let b=document.createElement("button");
b.innerText=a;
b.onclick=()=>check(idx===q.correct,q);
document.getElementById("answers").appendChild(b);
});
}

function check(correct,q){
if(locked) return;
locked=true;

if(correct){
score++;
document.getElementById("score").innerText="Score: "+score;
document.getElementById("explain").innerText="✔ "+q.explain;
}else{
document.getElementById("explain").innerText="❌ "+q.explain;
}

document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){
i++;
if(i<quiz.length){
load();
}else{
finish();
}
}

function saveScore(){
let name=document.getElementById("playerName").value||"Player";
let data=JSON.parse(localStorage.getItem("bio")||"[]");
data.push({name,score});
data.sort((a,b)=>b.score-a.score);
data=data.slice(0,5);
localStorage.setItem("bio",JSON.stringify(data));
}

function showLB(){
let data=JSON.parse(localStorage.getItem("bio")||"[]");
let html="";
data.forEach((d,i)=>{
html+=`<p>${i+1}. ${d.name} - ${d.score}</p>`;
});
document.getElementById("lb").innerHTML=html;
}

function finish(){
saveScore();

document.getElementById("game").innerHTML=`
<h1>Finished</h1>
<h2>${score}/${quiz.length}</h2>
<h3>Leaderboard</h3>
<div id="lb"></div>
<button onclick="location.reload()">Restart</button>
`;

showLB();
}

/* background random */
document.querySelectorAll(".cute").forEach(e=>{
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(6+Math.random()*6)+"s";
});

document.querySelectorAll(".star").forEach(e=>{
e.style.left=Math.random()*100+"vw";
});

document.querySelectorAll(".particle").forEach(e=>{
e.style.left=Math.random()*100+"vw";
});

</script>

</body>
</html>
