<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biology Quiz</title>

  <style>

    body{
      background:#101820;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:20px;
    }

    .box{
      background:#1b2a41;

      width:90%;
      max-width:500px;

      margin:auto;
      padding:20px;

      border-radius:20px;
      box-shadow:0 0 20px black;
    }

    button{
      width:90%;

      padding:15px;
      margin:10px;

      font-size:16px;

      border:none;
      border-radius:10px;

      cursor:pointer;

      background:#00aaff;
      color:white;
    }

    button:hover{
      transform:scale(1.03);
    }

    #score{
      margin-top:20px;
      font-size:20px;
    }

    @media(max-width:600px){

      h1{
        font-size:28px;
      }

      h2{
        font-size:20px;
      }

      button{
        font-size:16px;
        padding:14px;
      }

    }

  </style>

</head>

<body>

<div class="box">

  <h1>Biology Quiz</h1>

  <h2 id="question">Loading...</h2>

  <div id="answers"></div>

  <p id="score">Score: 0</p>

</div>

<script>

const quiz = [

{
question:"การแพร่ (Diffusion) คืออะไร?",

answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],

correct:0
},

{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",

answers:[
"โปรตีน",
"น้ำ",
"DNA",
"ออกซิเจน"
],

correct:1
},

{
question:"น้ำจะเคลื่อนที่ไปทางใดในการออสโมซิส?",

answers:[
"จากสารเข้มข้นมากไปน้อย",
"จากน้ำมากไปน้ำน้อย",
"จากน้ำน้อยไปน้ำมาก",
"สุ่มทิศทาง"
],

correct:1
},

{
question:"Diffusion ต้องใช้พลังงานหรือไม่?",

answers:[
"ใช้ ATP",
"ไม่ใช้พลังงาน",
"ใช้กลูโคส",
"ใช้เอนไซม์"
],

correct:1
}

];

let current = 0;
let score = 0;

function loadQuestion(){

  document.getElementById("question").innerText =
  quiz[current].question;

  const answersDiv =
  document.getElementById("answers");

  answersDiv.innerHTML = "";

  quiz[current].answers.forEach((answer,index)=>{

    const btn = document.createElement("button");

    btn.innerText = answer;

    btn.onclick = ()=>checkAnswer(index);

    answersDiv.appendChild(btn);

  });

}

function checkAnswer(index){

  if(index == quiz[current].correct){

    score++;

    document.getElementById("score").innerText =
    "✅ Correct!";

  }else{

    document.getElementById("score").innerText =
    "❌ Wrong!";

  }

  current++;

  if(current < quiz.length){

    setTimeout(()=>{
      loadQuestion();
    },700);

  }else{

    setTimeout(()=>{

      document.querySelector(".box").innerHTML =

      `<h1>Finished!</h1>
      <h2>Your Score: ${score}/${quiz.length}</h2>`;

    },700);

  }

}

loadQuestion();

</script>

</body>

</html>
