<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biology Quiz</title>

<style>

body{
  background: radial-gradient(circle at top,
    #0b1b2b,
    #07111c,
    #050b12
  );

  min-height:100vh;
  overflow:hidden;

  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation:floatStar 8s linear infinite;
}

@keyframes floatStar{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(0,200,255,0.4);
  border-radius:50%;
  animation:move 12s linear infinite;
}

@keyframes move{
  0%{ transform:translate(0,100vh); }
  100%{ transform:translate(100vw,-10vh); }
}

.box{
  background:rgba(27,42,65,0.85);
  backdrop-filter:blur(6px);

  width:90%;
  max-width:500px;

  margin:auto;
  padding:20px;

  border-radius:20px;
  box-shadow:0 0 20px black;

  position:relative;
  z-index:2;
}

button{
  width:90%;
  padding:15px;
  margin:10px;

  font-size:16px;

  border:none;
  border-radius:10px;

  cursor:pointer;

  background:#00aaff;
  color:white;

  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 15px cyan;
}

#score{
  margin-top:20px;
  font-size:20px;
}

#explain{
  margin-top:10px;
  font-size:16px;
  color:#bcdcff;
}

@media(max-width:600px){
  h1{ font-size:28px; }
  h2{ font-size:20px; }
  button{
    font-size:16px;
    padding:14px;
  }
}

</style>

</head>

<body>

<div class="box">

<h1>🧪 Biology Quiz</h1>

<h2 id="question">Loading...</h2>

<div id="answers"></div>

<p id="score">Score: 0</p>
<p id="explain"></p>

</div>

<script>

const quiz = [
{
question:"การแพร่ (Diffusion) คืออะไร?",
answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],
correct:0,
explain:"Diffusion คือการเคลื่อนที่ของสารจากบริเวณเข้มข้นมากไปน้อย โดยไม่ใช้พลังงาน"
},
{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",
answers:["โปรตีน","น้ำ","DNA","ออกซิเจน"],
correct:1,
explain:"Osmosis คือการเคลื่อนที่ของน้ำผ่านเยื่อเลือกผ่าน"
},
{
question:"น้ำจะเคลื่อนที่ไปทางใดในการออสโมซิส?",
answers:[
"จากสารเข้มข้นมากไปน้อย",
"จากน้ำมากไปน้ำน้อย",
"จากน้ำน้อยไปน้ำมาก",
"สุ่มทิศทาง"
],
correct:1,
explain:"น้ำจะเคลื่อนที่จากบริเวณที่มีน้ำมากไปน้ำน้อย"
},
{
question:"ภาวะที่อนุภาคของสารกระจายตัวจนมีความเข้มข้นเท่ากันทุกบริเวณเรียกว่าอะไร?",
answers:[
"การออสโมซิส",
"การแพร่แบบธรรมดา",
"ไก่หมกหม้อ",
"สมดุลของการแพร่"
],
correct:3,
explain:"เรียกว่า dynamic equilibrium หรือสมดุลของการแพร่"
},
{
question:"การแพร่ (Diffusion) ใช้พลังงานแบบไหน?",
answers:["ใช้ ATP","ไม่ใช้พลังงาน","ใช้กลูโคส","ใช้เอนไซม์"],
correct:1,
explain:"Diffusion เป็น passive transport ไม่ใช้พลังงาน"
}
];

let current = 0;
let score = 0;

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

shuffle(quiz);

function loadQuestion(){

  let q = quiz[current];

  let answers = q.answers
    .map((text, i) => ({
      text,
      correct: i === q.correct
    }))
    .sort(() => Math.random() - 0.5);

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";
  document.getElementById("explain").innerText = "";

  document.getElementById("question").innerText = q.question;

  answers.forEach(a => {
    const btn = document.createElement("button");
    btn.innerText = a.text;
    btn.onclick = () => checkAnswer(a.correct, a.text, q);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(isCorrect, selectedText, q){

  const correctText = q.answers[q.correct];

  if(isCorrect){
    score++;
    document.getElementById("score").innerText = "✅ Correct!";
    document.getElementById("explain").innerText =
      "✔ ถูกต้อง! " + q.explain;
  }else{
    document.getElementById("score").innerText = "❌ Wrong!";
    document.getElementById("explain").innerText =
      "❌ คุณเลือก: " + selectedText + "\n" +
      "✔ คำตอบที่ถูกคือ: " + correctText + "\n\n" +
      q.explain;
  }

  current++;

  if(current < quiz.length){
    setTimeout(loadQuestion,2000);
  }else{
    setTimeout(()=>{
      document.querySelector(".box").innerHTML =
      `<h1>🧪 Finished!</h1>
      <h2>Your Score: ${score}/${quiz.length}</h2>`;
    },2000);
  }
}

loadQuestion();

</script>

</body>
</html>
