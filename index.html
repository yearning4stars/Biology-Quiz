<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biology Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>

html, body{
  height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:'Comic Neue', Arial;
}

body{
  background: radial-gradient(circle at top,#0b1b2b,#07111c,#050b12);
  color:white;
  text-align:center;
}

/* BOX */
.box{
  display:none;
  width:92%;
  max-width:520px;
  margin:40px auto;
  padding:20px;
  background:rgba(27,42,65,0.85);
  border-radius:24px;
}

/* BUTTON */
button{
  width:90%;
  padding:14px;
  margin:8px;
  font-size:16px;
  font-family:'Comic Neue', Arial;
  border:none;
  border-radius:16px;
  cursor:pointer;
  background: linear-gradient(135deg,#00aaff,#66ffcc);
  color:white;
}

#hintBtn{
  background: linear-gradient(135deg,#ffcc00,#ff66aa);
  color:black;
}

#nextBtn{
  display:none;
  background:#00ffb3;
  color:black;
  font-weight:bold;
}

/* TIMER */
#timer{
  font-size:20px;
  color:#00ffb3;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
  <h1>🧪 Biology Quiz</h1>
  <button onclick="startGame()">▶ Start</button>
</div>

<!-- GAME -->
<div class="box" id="game">

<h2 id="question"></h2>

<div id="timer">⏰ Time: 30</div>

<div id="answers"></div>

<p id="score">Score: 0</p>
<p id="explain"></p>

<button id="hintBtn" onclick="useHint()">💡 Hint (50/50)</button>
<button id="nextBtn" onclick="nextQuestion()">Next ➜</button>

</div>

<script>

const quiz = [
{
question:"การแพร่ คืออะไร?",
answers:[
"การเคลื่อนที่จากเข้มข้นมากไปน้อย",
"การใช้งาน ATP",
"การแบ่งเซลล์",
"การสร้างโปรตีน"
],
correct:0,
explain:"การแพร่ คือการเคลื่อนที่ของสารจากเข้มข้นสูงไปต่ำ"
},
{
question:"ข้อใดเป็นตัวอย่างของการแพร่?",
answers:[
"น้ำเข้าสู่รากพืช",
"ออกซิเจนเข้าสู่เซลล์",
"เม็ดเลือดขาวกินเชื้อโรค",
"การย่อยอาหาร"
],
correct:1,
explain:"ออกซิเจนเข้าสู่เซลล์เป็นการแพร่"
},
{
question:"ออสโมซิสเกี่ยวข้องกับอะไร?",
answers:[
"โปรตีน",
"น้ำ",
"DNA",
"ออกซิเจน"
],
correct:1,
explain:"Osmosis คือการเคลื่อนที่ของน้ำ"
}
];

quiz.sort(()=>Math.random()-0.5);

let i=0;
let score=0;
let time=30;
let timer;
let locked=false;
let hintUsed=false;

function startGame(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  load();
}

function startTimer(){

  clearInterval(timer);

  time=30;
  document.getElementById("timer").innerText="⏰ Time: "+time;

  timer=setInterval(()=>{

    time--;
    document.getElementById("timer").innerText="⏰ Time: "+time;

    if(time<=0){
      clearInterval(timer);
      fail();
    }

  },1000);
}

function load(){

  locked=false;
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("explain").innerText="";

  // reset hint
  hintUsed=false;
  document.getElementById("hintBtn").disabled=false;
  document.getElementById("hintBtn").innerText="💡 Hint (50/50)";

  let q=quiz[i];
  document.getElementById("question").innerText=q.question;

  document.getElementById("answers").innerHTML="";

  startTimer();

  let shuffled=q.answers.map((a,index)=>({
    text:a,
    correct:index===q.correct
  }));

  shuffled.sort(()=>Math.random()-0.5);

  shuffled.forEach(choice=>{
    let b=document.createElement("button");
    b.innerText=choice.text;
    b.onclick=()=>check(choice.correct,q);
    document.getElementById("answers").appendChild(b);
  });
}

function check(isCorrect,q){

  if(locked) return;
  locked=true;

  clearInterval(timer);

  const correctText=q.answers[q.correct];

  if(isCorrect){
    score++;
    document.getElementById("score").innerText="Score: "+score;
    document.getElementById("explain").innerText="✔ ถูกต้อง\n\n"+q.explain;
  }else{
    document.getElementById("explain").innerText=
    "❌ ผิด\n✔ "+correctText+"\n\n"+q.explain;
  }

  document.querySelectorAll("#answers button").forEach(b=>{
    b.disabled=true;
  });

  document.getElementById("nextBtn").style.display="block";
}

function fail(){

  locked=true;

  let q=quiz[i];

  document.getElementById("explain").innerText=
  "⏰ หมดเวลา\n✔ "+q.answers[q.correct]+"\n\n"+q.explain;

  document.querySelectorAll("#answers button").forEach(b=>{
    b.disabled=true;
  });

  document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){

  i++;

  if(i<quiz.length){
    load();
  }else{
    document.getElementById("game").innerHTML=
    `<h1>🎉 Finished!</h1><h2>Score: ${score}/${quiz.length}</h2>`;
  }
}

/* 💡 HINT 50/50 */
function useHint(){

  if(hintUsed) return;
  hintUsed = true;

  const buttons = Array.from(document.querySelectorAll("#answers button"));
  const q = quiz[i];

  const correctText = q.answers[q.correct];

  let wrongButtons = buttons.filter(b => b.innerText !== correctText);
  let correctButton = buttons.find(b => b.innerText === correctText);

  wrongButtons.sort(()=>Math.random()-0.5);

  let keep = [
    correctButton,
    wrongButtons[0]
  ];

  buttons.forEach(b=>{
    if(!keep.includes(b)){
      b.style.display="none";
    }
  });

  document.getElementById("hintBtn").disabled=true;
  document.getElementById("hintBtn").innerText="💡 50/50 Used";
}

</script>

</body>
</html>
